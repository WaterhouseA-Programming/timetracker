# Installed by update-routine/github/rollout.ps1
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/push-worker"]
    schedule: { interval: weekly, day: sunday, time: "03:00", timezone: Europe/London }
    cooldown: { default-days: 3 }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule: { interval: weekly, day: sunday, time: "03:00", timezone: Europe/London }
    cooldown: { default-days: 3 }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
