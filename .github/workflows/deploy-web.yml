name: Deploy Tasks PWA

on:
  push:
    branches: [master]
    paths:
      - 'tasks-web/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: write

# Serialize with release.yml: both push to gh-pages, and overlapping Pages
# builds make one fail with "Deployment failed, try again later". Sharing a
# group (queue, don't cancel) keeps the two gh-pages pushes from racing without
# ever cancelling an in-flight release build.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Skip if release.yml also runs
        id: guard
        # A push that touches anything outside tasks-web/ also triggers
        # release.yml, which checks out this same commit and deploys the whole
        # tasks-web/ tree (PWA files + fresh latest.yml) to gh-pages. Running
        # here too would be a second, redundant gh-pages push that races the
        # first as overlapping Pages builds. So deploy only when the push is
        # tasks-web-only (the case where release.yml is skipped).
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qvE '^tasks-web/'; then
            echo "Non-tasks-web files changed — release.yml will deploy. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        if: steps.guard.outputs.skip == 'false'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tasks-web
          cname: ''   # leave blank unless you add a custom domain
          # latest.yml is owned by release.yml. This workflow checks out the
          # push commit, whose updates/latest.yml is still the PREVIOUS release
          # (the new one is only committed to master at the end of the release
          # job), so deploying it here would roll the desktop updater back.
          # Exclude it from the publish and keep whatever release.yml put on
          # gh-pages so the two workflows never fight over the manifest.
          exclude_assets: 'updates/latest.yml'
          keep_files: true
