name: Build & Release

on:
  push:
    branches: [master]
    paths-ignore:
      # Prevent infinite loop: when this workflow commits latest.yml to
      # tasks-web/updates/, that push must NOT re-trigger another release build.
      - 'tasks-web/**'

permissions:
  contents: write
  pages: write   # allows the self-heal step to request a fresh Pages build via the API

# Shares gh-pages-deploy with deploy-web.yml so the two never push to gh-pages
# at the same time. Queue rather than cancel — a release build must never be
# killed mid-flight by a PWA deploy.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version from run number
        # Uses major.minor from package.json, run number as patch (always increments)
        # e.g. package.json has 1.0.0 → built as 1.0.7, 1.0.8, 1.0.9 ...
        # Never commits back to the repo so no race conditions possible
        run: |
          $base = (node -p "require('./package.json').version") -replace '\.\d+$', ''
          npm version "$base.${{ github.run_number }}" --no-git-tag-version

      - name: Create the GitHub release before building
        # electron-builder publishes each win target (nsis and portable)
        # concurrently, and from v26 both race to POST /releases for the same
        # tag. One wins; the loser gets back a 422 "Published releases must have
        # a valid tag" — a misleading message for "this tag already has a
        # release" — and that fails the whole job even though the installers
        # uploaded fine. It dies before latest.yml is written, so the update
        # manifest silently stays on the previous version.
        #
        # Creating the release up front means both publishers find an existing
        # release and only upload assets to it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists — reusing it"
          } else {
            gh release create $tag --title $version --notes "Automated release" --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "could not create release $tag" }
            Write-Host "Created release $tag"
          }
          exit 0

      - name: Build & publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist -- --publish always

      - name: Rewrite latest.yml with absolute GitHub Releases URLs
        # Rewrites the relative installer URL in dist/latest.yml to an absolute
        # GitHub Releases URL and writes the result into tasks-web/updates/ so
        # the next step can deploy it to Pages.
        id: rewrite
        shell: pwsh
        run: |
          $content = Get-Content dist/latest.yml -Raw
          $version = (Select-String -InputObject $content -Pattern 'version:\s+(.+)').Matches[0].Groups[1].Value.Trim()
          $ghBase  = "https://github.com/WaterhouseA-Programming/timetracker/releases/download/v$version"

          $content = $content -replace '(url: )(TimeTracker)',  "`$1$ghBase/`$2"
          $content = $content -replace '(path: )(TimeTracker)', "`$1$ghBase/`$2"

          New-Item -Force -ItemType Directory -Path tasks-web/updates | Out-Null
          [System.IO.File]::WriteAllText("$PWD/tasks-web/updates/latest.yml", $content, [System.Text.UTF8Encoding]::new($false))
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Deploy tasks-web to GitHub Pages
        # Deploy directly here so Pages is always current after a build.
        # Pushes made by GITHUB_TOKEN don't trigger other workflows, so relying
        # on deploy-web.yml to pick up the latest.yml commit would leave Pages stale.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tasks-web

      - name: Commit latest.yml to master
        # Best-effort — Pages is already updated above, this just keeps the
        # repo copy in sync so deploy-web.yml has the right file when it runs.
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git add tasks-web/updates/latest.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish latest.yml for v${{ steps.rewrite.outputs.version }}"
          git fetch origin master
          git rebase origin/master
          git push

      - name: Ensure Pages finished building (self-heal flaky Pages builds)
        # GitHub Pages intermittently reports "Deployment failed, try again
        # later" or leaves a build stuck in "building" for many minutes, which
        # keeps the desktop auto-updater on the previous version. Poll the Pages
        # build status and, if it errors or stalls, request a fresh build via
        # the API (the same manual nudge that reliably unsticks it). The
        # gh-pages branch already has the correct content, so this only forces
        # GitHub to serve it.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          kicked=0
          for i in $(seq 1 24); do
            sleep 15
            status=$(gh api "repos/$repo/pages/builds/latest" --jq '.status' 2>/dev/null || echo unknown)
            echo "attempt $i: pages build status=$status"
            if [ "$status" = "built" ]; then
              echo "Pages build completed."
              exit 0
            fi
            # Request one fresh build if it errored, or if it's been stuck
            # 'building' for ~2 minutes.
            if [ "$kicked" = "0" ] && { [ "$status" = "errored" ] || [ "$i" -ge 8 ]; }; then
              echo "Pages build not healthy (status=$status) — requesting a fresh build."
              gh api -X POST "repos/$repo/pages/builds" >/dev/null 2>&1 || true
              kicked=1
            fi
          done
          echo "::warning::Pages build did not report 'built' in time. The gh-pages branch is correct; the CDN should catch up shortly."
